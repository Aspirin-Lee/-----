name: Notion gateway tests
on:
  push:
    paths: ['server/**', 'render.yaml', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'render.yaml', '.github/workflows/server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/notion.test.mjs
      - run: docker build -f server/Dockerfile -t labday-notion:test .
